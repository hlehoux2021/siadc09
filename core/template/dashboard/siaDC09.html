<div class="eqLogic eqLogic-widget allowResize allowReorder #custom_layout# #eqType# siaDC09 #category#"
     style="width:#width#;height:#height#;#style#"
     data-eqType="#eqType#"
     data-eqLogic_id="#id#"
     data-eqLogic_uid="#uid#"
     data-version="#version#"
     data-translate-category="#translate_category#"
     data-category="#category#"
     data-tags="#tags#"
     data-supervision-interval="#supervision_interval#">

  <div class="widget-name">
    <span class="warning" title="#alert_name#"><i class="#alert_icon#"></i></span>
    <span class="widget-name-link reportModeHidden">
      <a href="#eqLink#">#name_display#</a>
      <span class="object_name">#object_name#</span>
    </span>
    <span class="reportModeVisible">#name_display# <span class="object_name">#object_name#</span></span>
  </div>

  <div style="padding:4px 10px 8px 10px;">

    <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
      <i class="fas fa-circle #badge_class# siaDC09-badge" style="font-size:0.75em;"></i>
      <span style="font-size:0.9em;" class="siaDC09-label">#supervision_label#</span>
    </div>

    <hr style="margin:4px 0;" />

    <div style="font-size:0.75em;font-weight:bold;color:#777;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:1px;">Alarme</div>
    <div style="font-size:0.8em;color:#555;word-break:break-word;">
      <span class="siaDC09-event">#event_label#</span>
    </div>

  </div>

  <script type="text/javascript">
  (function() {
    var rootEl = document.querySelector('[data-eqLogic_id="#id#"].siaDC09');
    if (!rootEl) return;
    var eqId = '#id#';
    var interval = parseInt('#supervision_interval#', 10) || 60;
    var staleThreshold = interval * 3;

    var badge   = rootEl.querySelector('.siaDC09-badge');
    var labelEl = rootEl.querySelector('.siaDC09-label');
    var eventEl = rootEl.querySelector('.siaDC09-event');

    // Map a supervision_state numeric value to its badge color class.
    // Mirrors toHtml(): 2 -> success, 1 -> warning, null/'' -> muted, else danger.
    function badgeClassForState(raw) {
      var txt = (raw === null || raw === undefined) ? '' : String(raw).trim();
      if (txt === '') return 'text-muted';
      var n = parseInt(txt, 10);
      if (isNaN(n)) return 'text-danger';
      if (n === 2) return 'text-success';
      if (n === 1) return 'text-warning';
      return 'text-danger';
    }

    function setBadgeClass(cls) {
      if (!badge) return;
      badge.classList.remove('text-success', 'text-warning', 'text-danger', 'text-muted');
      badge.classList.add(cls);
    }

    // Live refresh (story 10.3). Jeedom's poll loop (jeedom.changes) dispatches a
    // cmd::update CustomEvent on document.body; jeedom.cmd.refreshValue then calls
    // every callback registered here for the changed command id, with _options =
    // {value, display_value, valueDate, collectDate, unit, alertLevel}. A custom
    // eqLogic tile like this one bypasses the stock per-command widgets, so it must
    // register its own callbacks or it never updates without a page reload.
    if (typeof jeedom !== 'undefined' && jeedom.cmd && typeof jeedom.cmd.addUpdateFunction === 'function') {

      // Command ids are '' when the eqLogic is missing that command (partial/legacy
      // config) — never register a callback on an empty id, it would collide with any
      // other incomplete tile's equally empty registration on the same dashboard.
      var supervisionLabelId = '#supervision_label_id#';
      var eventLabelId = '#event_label_id#';
      var supervisionStateId = '#supervision_state_id#';

      // supervision_label: the health text next to the badge.
      if (supervisionLabelId) {
        jeedom.cmd.addUpdateFunction(supervisionLabelId, function(_options) {
          if (labelEl) labelEl.textContent = _options.display_value;
        });
      }

      // event_label: the last alarm result line. Directly fixes the "reste à OK"
      // observation — moves to "Confirmé" on its own when the daemon pushes it.
      if (eventLabelId) {
        jeedom.cmd.addUpdateFunction(eventLabelId, function(_options) {
          if (eventEl) eventEl.textContent = _options.display_value;
        });
      }

      // supervision_state: numeric health -> badge color. A live push also proves the
      // tile is fresh, so it clears the stale-grey + tooltip the 10-2 check applied.
      if (supervisionStateId) {
        jeedom.cmd.addUpdateFunction(supervisionStateId, function(_options) {
          setBadgeClass(badgeClassForState(_options.value));
          if (badge) badge.removeAttribute('title');
        });
      }
    }

    // One-shot staleness check (story 10-2): grey the badge + relabel when the last
    // supervision_state update is older than 3 x the supervision interval. Runs once
    // on render; the live callbacks above take over the moment a fresh value arrives.
    jeedom.eqLogic.byId({
      id: eqId,
      getCmdState: 1,
      success: function(data) {
        var cmds = data.cmd || [];
        var stateCmd = null;
        for (var i = 0; i < cmds.length; i++) {
          if (cmds[i].logicalId === 'supervision_state') {
            stateCmd = cmds[i];
            break;
          }
        }
        if (!stateCmd || !stateCmd.collectDate) return;

        var collectTime = new Date(stateCmd.collectDate.replace(/-/g, '/')).getTime();
        if (isNaN(collectTime)) return;
        var staleSince = (Date.now() - collectTime) / 1000;

        if (staleSince > staleThreshold) {
          if (badge) {
            setBadgeClass('text-muted');
            var minutes = Math.floor(staleSince / 60);
            var hours = Math.floor(minutes / 60);
            var tooltip = '#stale_tooltip_prefix# ';
            if (hours > 0) {
              tooltip += hours + 'h' + (minutes % 60 > 0 ? String(minutes % 60).padStart(2, '0') : '');
            } else {
              tooltip += minutes + ' min';
            }
            badge.setAttribute('title', tooltip);
          }
          if (labelEl) {
            labelEl.textContent = '#stale_label#';
          }
        }
      }
    });
  })();
  </script>

</div>
