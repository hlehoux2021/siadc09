<div class="eqLogic eqLogic-widget siaDC09 #category#"
     style="#style#"
     data-eqType="#eqType#"
     data-eqLogic_id="#id#"
     data-eqLogic_uid="#uid#"
     data-version="#version#"
     data-translate-category="#translate_category#"
     data-category="#category#"
     data-tags="#tags#"
     data-supervision-interval="#supervision_interval#">

  <center>
    <span class="widget-name">
      <span class="warning" title="#alert_name#"><i class="#alert_icon#"></i></span>
      <a href="#eqLink#">#name_display#</a>
      <span class="object_name">#object_name#</span>
    </span>
  </center>

  <div style="padding:4px 10px 8px 10px;">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
      <span class="siaDC09-badge #badge_class#" style="flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.2em;height:2.2em;border:2px solid currentColor;border-radius:50%;">
        <i class="siaDC09-icon fas fa-question-circle"></i>
      </span>
      <span style="min-width:0;line-height:1.25;">
        <span class="siaDC09-label" style="display:block;font-size:0.95em;font-weight:bold;">#supervision_label#</span>
        <span class="siaDC09-sublabel" style="display:none;font-size:0.8em;opacity:0.7;"></span>
        <span class="siaDC09-health-time" style="display:block;font-size:0.8em;opacity:0.7;"></span>
      </span>
    </div>

    <hr style="margin:4px 0;" />

    <div style="font-size:0.7em;font-weight:bold;opacity:0.6;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px;">Dernier événement</div>
    <div class="siaDC09-event" data-raw="#event_label#" style="word-break:break-word;">
      <div class="siaDC09-event-head" style="display:none;align-items:center;gap:10px;margin-bottom:4px;">
        <span style="flex:none;display:inline-flex;align-items:center;justify-content:center;width:2.2em;height:2.2em;border:2px solid currentColor;border-radius:50%;opacity:0.85;">
          <i class="siaDC09-event-type fas"></i>
        </span>
        <span style="min-width:0;line-height:1.25;">
          <span class="siaDC09-event-type-text" style="display:block;font-size:0.95em;font-weight:bold;"></span>
          <span class="siaDC09-event-where" style="display:block;font-size:0.8em;opacity:0.7;"></span>
        </span>
      </div>
      <div class="siaDC09-event-status" style="font-size:0.9em;">
        <i class="siaDC09-event-status-icon fas" style="display:none;font-size:1.25em;vertical-align:middle;margin-right:2px;"></i>
        <span class="siaDC09-event-status-text">#event_label#</span>
        <span class="siaDC09-event-time" style="opacity:0.7;"></span>
      </div>
    </div>

  </div>

  <script type="text/javascript">
  (function() {
    var rootEl = document.querySelector('[data-eqLogic_id="#id#"].siaDC09');
    if (!rootEl) return;
    var eqId = '#id#';
    var interval = parseInt('#supervision_interval#', 10) || 60;
    var staleThreshold = interval * 3;
    var staleLabel = '#stale_label#';

    var badge   = rootEl.querySelector('.siaDC09-badge');
    var iconEl  = rootEl.querySelector('.siaDC09-icon');
    var labelEl = rootEl.querySelector('.siaDC09-label');
    var subEl   = rootEl.querySelector('.siaDC09-sublabel');
    var eventEl = rootEl.querySelector('.siaDC09-event');
    var evHead       = rootEl.querySelector('.siaDC09-event-head');
    var evTypeIcon   = rootEl.querySelector('.siaDC09-event-type');
    var evTypeText   = rootEl.querySelector('.siaDC09-event-type-text');
    var evWhere      = rootEl.querySelector('.siaDC09-event-where');
    var evStatusIcon = rootEl.querySelector('.siaDC09-event-status-icon');
    var evStatusText = rootEl.querySelector('.siaDC09-event-status-text');
    var evTime       = rootEl.querySelector('.siaDC09-event-time');

    var COLOR_CLASSES = ['text-success', 'text-warning', 'text-danger', 'text-muted'];

    function pad2(n) { return String(n).padStart(2, '0'); }
    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    function parseDate(s) {
      if (!s) return NaN;
      return new Date(String(s).replace(/-/g, '/')).getTime();
    }

    // Relative while recent (with the precise clock time appended), absolute with
    // seconds once older than today.
    function formatTime(ms, nowMs) {
      var d = new Date(ms), now = new Date(nowMs), diff = nowMs - ms;
      var hhmmss = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
      if (diff < 60000) return "à l'instant · " + hhmmss;
      if (diff < 3600000) return 'il y a ' + Math.floor(diff / 60000) + ' min · ' + hhmmss;
      if (sameDay(d, now)) return 'il y a ' + Math.floor(diff / 3600000) + ' h · ' + hhmmss;
      if (sameDay(d, new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1))) return 'hier ' + hhmmss;
      return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + ' ' + hhmmss;
    }


    // ── SM1: supervision badge ───────────────────────────────────────────────
    // supervision_state is 0/1/2 only, so the icon is chosen from the label text
    // (daemon.py _supervision_label()); the state only gives the color.
    var SM1_ICONS = [
      { re: /dégradée/i,       icon: 'fa-exclamation-triangle' },
      { re: /initialisation/i, icon: 'fa-spinner fa-pulse' },
      { re: /^connexion ok/i,  icon: 'fa-check-circle' },
      { re: /perdue/i,         icon: 'fa-unlink' },
      { re: /reconnexion/i,    icon: 'fa-sync-alt fa-spin' },
      { re: /hors réseau/i,    icon: 'fa-plug' },
      { re: /clé/i,            icon: 'fa-key' },
      { re: /arrêté/i,         icon: 'fa-stop-circle' },
      { re: /désactivé/i,      icon: 'fa-pause-circle', cls: 'text-muted' }
    ];
    var SM1_FALLBACK = {
      'text-success': 'fa-check-circle',
      'text-warning': 'fa-exclamation-triangle',
      'text-danger': 'fa-times-circle',
      'text-muted': 'fa-question-circle'
    };

    function currentColorClass() {
      for (var i = 0; badge && i < COLOR_CLASSES.length; i++) {
        if (badge.classList.contains(COLOR_CLASSES[i])) return COLOR_CLASSES[i];
      }
      return 'text-muted';
    }

    var stateCls = currentColorClass();
    var labelRaw = labelEl ? labelEl.textContent.trim() : '';
    var stale = false;
    var healthTimeEl = rootEl.querySelector('.siaDC09-health-time');
    var healthTimeMs = NaN;

    // Time of the last supervision_state update: every supervision frame and RP
    // cyclic test ACK pushes it, so it shows the link was last seen alive.
    function renderHealthTime() {
      if (healthTimeEl) healthTimeEl.textContent = isNaN(healthTimeMs) ? '' : formatTime(healthTimeMs, Date.now());
    }

    // Map a supervision_state numeric value to its badge color class.
    // Mirrors toHtml(): 2 -> success, 1 -> warning, null/'' -> muted, else danger.
    function badgeClassForState(raw) {
      var txt = (raw === null || raw === undefined) ? '' : String(raw).trim();
      if (txt === '') return 'text-muted';
      var n = parseInt(txt, 10);
      if (isNaN(n)) return 'text-danger';
      if (n === 2) return 'text-success';
      if (n === 1) return 'text-warning';
      return 'text-danger';
    }

    function renderHealth() {
      if (!badge) return;
      var cls = stateCls, icon, text = labelRaw, sub = '';
      if (stale) {
        cls = 'text-muted';
        icon = 'fa-clock';
        text = staleLabel;
      } else {
        var entry = null;
        for (var i = 0; i < SM1_ICONS.length; i++) {
          if (SM1_ICONS[i].re.test(labelRaw)) { entry = SM1_ICONS[i]; break; }
        }
        icon = entry ? entry.icon : SM1_FALLBACK[stateCls];
        if (entry && entry.cls) cls = entry.cls;
        var m = /^(.*?)\s*\((\d+\/\d+)\)\s*$/.exec(labelRaw);
        if (m) { text = m[1]; sub = m[2]; }
      }
      badge.classList.remove.apply(badge.classList, COLOR_CLASSES);
      badge.classList.add(cls);
      if (iconEl) iconEl.className = 'siaDC09-icon fas ' + icon;
      if (labelEl) labelEl.textContent = text;
      if (subEl) {
        subEl.textContent = sub;
        subEl.style.display = sub ? 'block' : 'none';
      }
    }

    // ── SM2: last event card ─────────────────────────────────────────────────
    // event_label is "{Type} (zone N|utilisateur N) : {état}" (daemon.py
    // _event_label_from_sm2()); the time comes from the command's collectDate.
    var SM2_TYPES = {
      'intrusion': 'fa-user-secret', 'incendie': 'fa-fire', 'panique': 'fa-bell',
      'armement': 'fa-lock', 'désarmement': 'fa-lock-open', 'annulation': 'fa-undo'
    };
    var SM2_STATUS = [
      { re: /en cours/i,       icon: 'fa-spinner fa-pulse', cls: 'text-warning' },
      { re: /confirmée/i,      icon: 'fa-check-circle',     cls: 'text-success' },
      { re: /refusé/i,         icon: 'fa-ban',              cls: 'text-danger' },
      { re: /sans réponse/i,   icon: 'fa-times-circle',     cls: 'text-danger' },
      { re: /non transmise/i,  icon: 'fa-key',              cls: 'text-danger' }
    ];
    var STATUS_CLASSES = ['text-success', 'text-warning', 'text-danger'];
    var eventTimeMs = NaN;
    var showTime = false;

    function renderEventTime() {
      if (!evTime) return;
      evTime.textContent = (showTime && !isNaN(eventTimeMs))
        ? ' · ' + formatTime(eventTimeMs, Date.now()) : '';
    }

    function renderEvent() {
      if (!eventEl) return;
      var raw = eventEl.getAttribute('data-raw') || '';
      var idx = raw.indexOf(' : ');
      var st = null;
      if (idx >= 0) {
        var statusTxt = raw.slice(idx + 3);
        for (var i = 0; i < SM2_STATUS.length; i++) {
          if (SM2_STATUS[i].re.test(statusTxt)) { st = SM2_STATUS[i]; break; }
        }
      }
      evStatusText.classList.remove.apply(evStatusText.classList, STATUS_CLASSES);
      evStatusIcon.classList.remove.apply(evStatusIcon.classList, STATUS_CLASSES);
      if (!st) {
        // Idle ("Inactif", "Aucun événement…") or an unknown text: discreet raw line.
        showTime = false;
        evHead.style.display = 'none';
        evStatusIcon.style.display = 'none';
        evStatusText.textContent = raw;
        evStatusText.style.opacity = '0.6';
        renderEventTime();
        return;
      }
      var head = raw.slice(0, idx);
      var m = /^(.*?)\s*\((zone|utilisateur)\s+(\d+)\)\s*$/i.exec(head);
      var typeName = m ? m[1] : head;
      evTypeText.textContent = typeName;
      evWhere.textContent = m ? m[2] + ' ' + m[3] : '';
      evTypeIcon.className = 'siaDC09-event-type fas ' + (SM2_TYPES[typeName.toLowerCase()] || 'fa-bell');
      evHead.style.display = 'flex';
      evStatusIcon.className = 'siaDC09-event-status-icon fas ' + st.icon + ' ' + st.cls;
      evStatusIcon.style.display = '';
      evStatusText.textContent = raw.slice(idx + 3);
      evStatusText.classList.add(st.cls);
      evStatusText.style.opacity = '';
      showTime = true;
      renderEventTime();
    }

    renderHealth();
    renderEvent();
    var timer = setInterval(function() {
      if (!document.body.contains(rootEl)) { clearInterval(timer); return; }
      renderEventTime();
      renderHealthTime();
    }, 30000);

    // Live refresh (story 10.3). Jeedom's poll loop (jeedom.changes) dispatches a
    // cmd::update CustomEvent on document.body; jeedom.cmd.refreshValue then calls
    // every callback registered here for the changed command id, with _options =
    // {value, display_value, valueDate, collectDate, unit, alertLevel}. A custom
    // eqLogic tile like this one bypasses the stock per-command widgets, so it must
    // register its own callbacks or it never updates without a page reload.
    if (typeof jeedom !== 'undefined' && jeedom.cmd && typeof jeedom.cmd.addUpdateFunction === 'function') {

      // Command ids are '' when the eqLogic is missing that command (partial/legacy
      // config) — never register a callback on an empty id, it would collide with any
      // other incomplete tile's equally empty registration on the same dashboard.
      var supervisionLabelId = '#supervision_label_id#';
      var eventLabelId = '#event_label_id#';
      var supervisionStateId = '#supervision_state_id#';

      // supervision_label: the health text (and, through it, the badge icon).
      // A fresh value also proves the tile is live, so it clears the stale view.
      if (supervisionLabelId) {
        jeedom.cmd.addUpdateFunction(supervisionLabelId, function(_options) {
          labelRaw = _options.display_value;
          stale = false;
          renderHealth();
        });
      }

      // event_label: the last alarm result. Parsed into type pill + status line,
      // with the time taken from the push's collectDate.
      if (eventLabelId) {
        jeedom.cmd.addUpdateFunction(eventLabelId, function(_options) {
          if (eventEl) eventEl.setAttribute('data-raw', _options.display_value);
          var ms = parseDate(_options.collectDate);
          if (!isNaN(ms)) eventTimeMs = ms;
          renderEvent();
        });
      }

      // supervision_state: numeric health -> badge color. A live push also proves the
      // tile is fresh, so it clears the stale-grey + tooltip the 10-2 check applied.
      if (supervisionStateId) {
        jeedom.cmd.addUpdateFunction(supervisionStateId, function(_options) {
          stateCls = badgeClassForState(_options.value);
          var stateMs = parseDate(_options.collectDate);
          if (!isNaN(stateMs)) { healthTimeMs = stateMs; renderHealthTime(); }
          stale = false;
          if (badge) badge.removeAttribute('title');
          renderHealth();
        });
      }
    }

    // Last-update times. jeedom.eqLogic.byId does not return the commands' dates, and
    // Jeedom's checkAndUpdateCmd() only refreshes the collectDate in its cache (no
    // cmd::update push) when a value is unchanged, so an RP/supervision ACK that leaves
    // the state at OK never reaches the live callbacks. The plugin endpoint therefore
    // returns the dates, on render and every 30 s. They also feed the stale check
    // (story 10-2): older than 3 x the supervision interval greys the badge.
    function applyDates(res) {
      var stateMs = parseDate(res.state_date);
      var eventMs = parseDate(res.event_date);
      if (!isNaN(eventMs)) { eventTimeMs = eventMs; renderEventTime(); }
      if (isNaN(stateMs)) return;
      healthTimeMs = stateMs;
      renderHealthTime();
      var staleSince = (Date.now() - stateMs) / 1000;
      if (staleSince > staleThreshold) {
        stale = true;
        renderHealth();
        if (badge) {
          var minutes = Math.floor(staleSince / 60);
          var hours = Math.floor(minutes / 60);
          var tooltip = '#stale_tooltip_prefix# ';
          if (hours > 0) {
            tooltip += hours + 'h' + (minutes % 60 > 0 ? String(minutes % 60).padStart(2, '0') : '');
          } else {
            tooltip += minutes + ' min';
          }
          badge.setAttribute('title', tooltip);
        }
      } else if (stale) {
        stale = false;
        if (badge) badge.removeAttribute('title');
        renderHealth();
      }
    }

    function pollDates() {
      if (typeof $ === 'undefined' || typeof $.ajax !== 'function') return;
      $.ajax({
        type: 'POST',
        url: 'plugins/siaDC09/core/ajax/siaDC09.ajax.php',
        data: { action: 'getWidgetDates', id: eqId },
        dataType: 'json',
        global: false,
        success: function(data) {
          if (data && data.state === 'ok' && data.result) applyDates(data.result);
        }
      });
    }
    pollDates();
    var pollTimer = setInterval(function() {
      if (!document.body.contains(rootEl)) { clearInterval(pollTimer); return; }
      pollDates();
    }, 30000);
  })();
  </script>

</div>
