[[entry]]
id = 14
type = "story"
title = "17.14 — Wizard Visual Conformance and Step Rebalancing"
description = "The wizard has three steps: Centrale (the center and the photo/video verification), Test (the connection test and the advanced options), Zones et alertes (the former steps 3 and 4 merged). The pages look like the Excalidraw mockup: a three-tab stepper on every screen; grey framed zones (#f8f9fa) with a title each; the label above its field, with related fields on one row (IP, port and transport; photo and video); one lock caption per locked panel, not one per field; the Options avancées bar folded and unfolded as drawn, now on the Test step; the failed-test screen as screen C. From the Test step the user can switch the profile to Personnalisé, change settings and run the test again without going back. The page no longer scrolls far, and link hover is readable. The mockup is updated for the three-step stepper and the advanced options on the Test step."
verify = "The user looks at the built pages side by side with the updated mockup, on test-jeedom or in screenshots, and each layout rule of the mockup is a criterion that holds. From a failed test, switching to Personnalisé, editing a setting and running the test again works without leaving the Test step. A wizard saved at the old step 3 or 4 resumes on the merged step. Link hover shows text with readable contrast. A jsdom or structure test alone does not close the story."
covers = []
after = [9, 10, 11, 12]
hitl = true
risk = "high"
references = ["ux — ux-17-wizard-step-1/.working/flow-wizard-step-1-2026-11-05.excalidraw, screens A B C (layout source of truth)", "ux — ux-17-wizard-step-1/DESIGN.md and EXPERIENCE.md, Layout & Spacing, Lock caption, Step 2 states", "design — internal-docs/design/wizard-design.md, the step list"]
notes = ["Rejected by the user after a test on test-jeedom, 2026-11-06: not like the mockup; 2-column title/field layout; a lock caption almost everywhere although the whole advanced panel is locked; the folded Options avancées is not as drawn; the page scrolls too much; grey link hover is unreadable (user, 2026-11-06)", "Step balance: step 1 is huge, step 2 is the test, step 3 is fine, step 4 is tiny and its place at the end is unexplained; rebalance the steps in this story (user, 2026-11-06)", "Plan context must include the mockup; each layout rule is a criterion; the user checks a rendered page before the story is called built (user, 2026-11-06)", "Assumption: the mockup wins over the text of DESIGN.md where they differ (stepper, framed zones, grey fill)", "Decision: three steps, decided by the user on 2026-11-06. Step 1 keeps the center and the photo/video verification. The advanced options move to step 2 beside the test. Zones and Alertes are merged into one step (user, 2026-11-06)", "Decision: switching to Personnalisé must be easy from step 2, for example after a failed test, to change settings and test again (user, 2026-11-06)", "Open question: does choosing Personnalisé on the Test step change the profile saved with the equipment, and does it rerun the test or wait for the user? Answer at plan time", "Risk high because changing the step range can stop the daemon launching on installs already saved; outside check: the user walks the wizard on test-jeedom with an equipment saved at the old step 3 and at step 4 (proposed, to confirm)", "Open question: the stored wizard step runs 1 to 4 and the daemon launch guard reads it; the merge changes its range and the wizard-design.md step list. Plan a safe mapping for wizards already saved at step 3 or 4"]

