# Epic 18 breakdown, agreed with the user on 2026-11-09. Status lives in the plans.

[[entry]]
id = 1
type = "story"
title = "FTPS test server"
description = "Sets up an FTPS server the plugin can upload to, reachable from test-jeedom, with a known certificate."
verify = "A standard FTPS client connects to it and uploads a file."
covers = ["E18-R1"]
after = []
hitl = true
risk = "low"
unknown = "Explicit (port 21) or implicit (port 990) TLS, and CA-signed or self-signed certificate: both certificate cases must be supported, settle which one the test server uses."

[[entry]]
id = 2
type = "story"
title = "Tracer: per-equipment FTPS keys, PHP to daemon, snapshot upload on BA alarm"
description = "Adds the equipment configuration keys for the FTPS upload (password as a password field like encryption_key), passes them to the daemon, and uploads the Frigate snapshot of a BA alarm, with no wizard yet."
verify = "With the keys set by hand on test-jeedom, a BA alarm puts a snapshot on the test server and the frame is sent as before."
covers = ["E18-R1", "E18-R2", "E18-R7"]
after = [1]
hitl = false
risk = "medium"
references = ["resources/siadc09d/frigate_prefetch.py", "core/class/siaDC09.class.php"]

