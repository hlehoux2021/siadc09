hitl = false
risk = "medium"
references = ["_bmad-output/initiative-my-project/epic-18-ftps-alarm-media-upload/ux-18-wizard-media-block"]

[[entry]]
id = 5
type = "story"
title = "18.5 — Clip upload"
description = "Uploads the clip of a BA alarm once Frigate has it, in addition to the snapshot, following the snapshot and clip switches."
verify = "A BA alarm with both switches on leaves a snapshot and a clip on the test server."
covers = ["E18-R2"]
after = [2]
hitl = false
risk = "medium"
unknown = "Whether the clip is ready when the alarm fires; frigate_prefetch.py upgrades to the clip later, so the upload may have to wait."

[[entry]]
id = 6
type = "story"
title = "18.6 — Upload robustness: timeout, certificate, secret handling"
description = "Adds the timeout so the frame is never delayed, certificate validation with a CA-signed or pinned self-signed certificate, and keeps the password out of logs and the debug UI."
verify = "With the server down or stalled the frame is ACKed on time and the failure is logged; a wrong certificate is refused; the password appears in no log."
covers = ["E18-R3", "E18-R4"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "18.7 — FTPS connection test action"
description = "Builds the FTPS test action that the step 2 test button calls (a stub until now): connection, certificate and login only, nothing written; it tells apart unreachable host, certificate failure and authentication failure, and returns the fingerprint the server presents for the trust button."
verify = "Against the test server each of the three failures shows its own message in step 2 and a correct setup reports success."
covers = ["E18-R5"]
after = [6, 12]
hitl = false
risk = "low"

